<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PageSnap Downloading...</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #9ca3af;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      gap: 12px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- plan-exempt — dedicated download tab to ensure Chrome completes file renaming without popup closure interruptions -->
  <div class="spinner"></div>
  <div id="status" class="title">Downloading file...</div>
  <script src="download.js"></script>
</body>
</html>
