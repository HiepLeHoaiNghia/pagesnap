<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageSnap Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- plan-exempt — 2-tier UI layout redesign with balanced header and contextual sub-toolbar -->
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <img src="icons/icon-48.png" class="logo-icon" width="22" height="22" style="border-radius: 6px;" alt="PageSnap">
        <h1 class="logo-text">Page<span class="highlight">Snap</span></h1>
      </div>
      <div class="header-actions">
        <label id="btn-launch-inspector" class="header-inspect-btn" title="Inspect any UI component on page to open Studio, copy styles, animations, or AI prompt" data-feature="regionSelect">
          <input type="checkbox" id="btn-toggle-select-region" style="display: none;">
          <span>🎯 Inspect ↗</span>
        </label>
        <button id="btn-refresh" class="icon-btn" title="Re-extract Page">↻</button>
        <button id="btn-settings" class="icon-btn" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Tabs Segment -->
      <div class="tabs-header">
        <button id="tab-md" class="tab-btn active">📝 Markdown</button>
        <button id="tab-html" class="tab-btn" data-feature="htmlClone">🌐 HTML Snapshot</button>
      </div>

      <!-- Contextual Sub-Toolbar -->
      <div class="sub-toolbar-wrapper">
        <div id="md-sub-toolbar" class="sub-toolbar">
          <span class="sub-toolbar-label">Extraction Mode:</span>
          <div class="mode-pill-group">
            <button type="button" id="mode-clean" class="mode-pill active" title="Clean article content via Mozilla Readability">✨ Clean Article</button>
            <button type="button" id="mode-raw" class="mode-pill" title="Full raw DOM content without filtering">📄 Full DOM</button>
            <input type="checkbox" id="btn-toggle-raw-mode" style="display: none;">
          </div>
        </div>
        <div id="html-sub-toolbar" class="sub-toolbar hidden" data-feature="htmlClone">
          <span class="sub-toolbar-desc">🌐 Standalone Offline Single-File Archive</span>
        </div>
      </div>

      <!-- Preview Box -->
      <div class="preview-container">
        <div class="preview-viewport">
          <textarea id="markdown-preview" readonly placeholder="No content extracted yet. Click refresh or navigate to a web page."></textarea>
          <div id="html-preview-wrapper" class="hidden" data-feature="htmlClone">
            <iframe id="html-preview-frame" sandbox="allow-same-origin"></iframe>
          </div>
        </div>
        <!-- Status Bar -->
        <div class="preview-status-bar">
          <span id="preview-mode" class="status-mode">🟢 Article Extraction</span>
          <span class="status-stats">
            <span id="char-count">0</span> chars &bull; <span id="token-count">0</span> tokens
          </span>
        </div>
      </div>

      <!-- Actions Footer -->
      <div class="actions-footer">
        <button id="btn-extract" style="display: none;"></button>
        <div class="actions-grid">
          <button id="btn-copy" class="action-btn primary-action-btn">📋 Copy Markdown</button>
          <button id="btn-download" class="action-btn secondary-action-btn">💾 Download .MD</button>
          <button id="btn-download-zip" class="action-btn secondary-action-btn" style="display: none;" data-feature="htmlClone">📦 ZIP Package</button>
        </div>
      </div>
    </main>

    <!-- Settings Pane (Slide-in/Hidden by default) -->
    <section id="settings-pane" class="settings-pane hidden">
      <div class="settings-header">
        <h2>Configuration</h2>
        <button id="btn-close-settings" class="close-btn">&times;</button>
      </div>
      <div class="settings-body">
        <div class="setting-group">
          <label class="toggle-switch">
            <input type="checkbox" id="setting-frontmatter" checked>
            <span class="slider"></span>
            <span class="label-text">Include YAML Frontmatter</span>
          </label>
        </div>

        <div class="setting-group">
          <label class="toggle-switch">
            <input type="checkbox" id="setting-images" checked>
            <span class="slider"></span>
            <span class="label-text">Keep Images</span>
          </label>
        </div>
        <div class="setting-group">
          <label class="toggle-switch">
            <input type="checkbox" id="setting-links" checked>
            <span class="slider"></span>
            <span class="label-text">Keep Links</span>
          </label>
        </div>
        <div class="setting-group">
          <label class="toggle-switch">
            <input type="checkbox" id="setting-obsidian">
            <span class="slider"></span>
            <span class="label-text">Obsidian-friendly Wikilinks</span>
          </label>
        </div>

        <div class="setting-section-title" style="margin-top: 14px; font-size: 10px; font-weight: bold; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 0.5px;">Features</div>
        <div id="features-section" class="features-section"></div>
      </div>
    </section>
  </div>

  <div id="resize-handle" class="resize-handle"></div>

  <script src="lib/turndown.js"></script>
  <script src="lib/turndown-plugin-gfm.js"></script>
  <script src="lib/readability.js"></script>
  <script src="lib/jszip.min.js"></script>
  <script src="src/popup/bootstrap.js"></script>
  <script src="src/content/markdown/dom-preprocess.js"></script>
  <script src="src/content/markdown/turndown-config.js"></script>
  <script src="src/content/markdown/extractor.js"></script>

  <script type="module" src="src/popup/index.js"></script>
</body>
</html>
