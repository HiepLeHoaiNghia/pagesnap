<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageSnap Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <img src="icons/icon-48.png" class="logo-icon" width="22" height="22" style="border-radius: 6px;" alt="PageSnap">
        <h1 class="logo-text">Page<span class="highlight">Snap</span></h1>
      </div>
      <div class="header-actions">
        <button id="btn-settings" class="icon-btn" title="Settings">⚙️</button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="app-main">
      <!-- Toolbar controls -->
      <div class="app-toolbar">
        <label class="toggle-switch compact-toggle" title="Extract full page body without skipping elements">
          <input type="checkbox" id="btn-toggle-raw-mode">
          <span class="slider"></span>
          <span class="label-text">📄 Full Page</span>
        </label>
        <label class="toggle-switch compact-toggle" title="Select a custom region on the page to copy/download" data-feature="regionSelect">
          <input type="checkbox" id="btn-toggle-select-region">
          <span class="slider"></span>
          <span class="label-text">🎯 Select Region</span>
        </label>
      </div>

      <!-- Preview Box -->
      <div class="preview-container">
        <div class="preview-header">
          <div class="tabs-header">
            <button id="tab-md" class="tab-btn active">Markdown</button>
            <button id="tab-html" class="tab-btn" data-feature="htmlClone">HTML Snapshot</button>
          </div>
        </div>
        <div class="preview-viewport">
          <textarea id="markdown-preview" readonly placeholder="No content extracted yet. Click 'Extract' or navigate to a web page."></textarea>
          <div id="html-preview-wrapper" class="hidden" data-feature="htmlClone">
            <iframe id="html-preview-frame" sandbox="allow-same-origin"></iframe>
          </div>
        </div>
        <!-- Status Bar -->
        <div class="preview-status-bar">
          <span id="preview-mode" class="status-mode">🟢 Local Extraction</span>
          <span class="status-stats">
            <span id="char-count">0</span> chars &bull; <span id="token-count">0</span> tokens
          </span>
        </div>
      </div>

      <!-- Actions Footer -->
      <div class="actions-footer">
        <button id="btn-extract" class="primary-btn">
          <span class="btn-icon">⚡</span> Extract Page
        </button>
        <div class="actions-grid">
          <button id="btn-copy" class="secondary-btn" disabled>📋 Copy Markdown</button>
          <button id="btn-download" class="secondary-btn" disabled>💾 Download .MD</button>
          <button id="btn-download-zip" class="secondary-btn" disabled data-feature="htmlClone">📦 ZIP Package</button>
        </div>
      </div>
    </main>

    <!-- Settings Pane (Slide-in/Hidden by default) -->
    <section id="settings-pane" class="settings-pane hidden">
      <div class="settings-header">
        <h2>Configuration</h2>
        <button id="btn-close-settings" class="close-btn">&times;</button>
      </div>
      <div class="settings-body">
        <div class="setting-group">
          <label class="toggle-switch">
            <input type="checkbox" id="setting-frontmatter" checked>
            <span class="slider"></span>
            <span class="label-text">Include YAML Frontmatter</span>
          </label>
        </div>
        <div class="setting-group">
          <label class="toggle-switch">
            <input type="checkbox" id="setting-raw">
            <span class="slider"></span>
            <span class="label-text">Full Page (Skip Readability)</span>
          </label>
        </div>
        <div class="setting-group">
          <label class="toggle-switch">
            <input type="checkbox" id="setting-images" checked>
            <span class="slider"></span>
            <span class="label-text">Keep Images</span>
          </label>
        </div>
        <div class="setting-group">
          <label class="toggle-switch">
            <input type="checkbox" id="setting-links" checked>
            <span class="slider"></span>
            <span class="label-text">Keep Links</span>
          </label>
        </div>
        <div class="setting-group">
          <label class="toggle-switch">
            <input type="checkbox" id="setting-obsidian">
            <span class="slider"></span>
            <span class="label-text">Obsidian-friendly Wikilinks</span>
          </label>
        </div>
        <div class="setting-section-title" style="margin-top: 14px; font-size: 10px; font-weight: bold; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 0.5px;">Features</div>
        <div id="features-section" class="features-section"></div>
      </div>
    </section>
  </div>

  <div id="resize-handle" class="resize-handle"></div>

  <script src="lib/turndown.js"></script>
  <script src="lib/turndown-plugin-gfm.js"></script>
  <script src="lib/jszip.min.js"></script>
  <script src="src/popup/bootstrap.js"></script>
  <script src="src/content/markdown/dom-preprocess.js"></script>
  <script src="src/content/markdown/turndown-config.js"></script>
  <script type="module" src="src/popup/index.js"></script>
</body>
</html>
