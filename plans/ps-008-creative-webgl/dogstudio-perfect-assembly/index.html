<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dogstudio Master Assembly - Exact Visual Alignment</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      background-color: #090a0f !important;
      color: #fff;
      overflow-x: hidden;
    }
    /* Fixed background image layer */
    #bg-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #090a0f url('./assets/background-xl.png') no-repeat center top;
      background-size: cover;
      opacity: 0.85;
      z-index: -3;
      pointer-events: none;
    }
    /* Fixed 3D WebGL Canvas Layer (z-index: 1 matching dogstudio dog-scene-inner) */
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Fixed Interactive Case Artwork Layer */
    #case-art-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    #case-art-layer.is-visible {
      opacity: 1;
    }
    /* DOM overlay (z-index: 2 on top of 3D canvas) */
    #dom-wrapper {
      position: relative;
      z-index: 2;
    }
    .pagesnap-component-wrapper {
      background: transparent !important;
    }
    .home-cases-list a {
      transition: opacity 0.3s ease, color 0.3s ease;
    }
    body.is-case-hovered .home-cases-list a:not(.is-hovered) {
      opacity: 0.18 !important;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div id="bg-layer"></div>
  <div id="case-art-layer"></div>
  <div id="canvas-container"></div>
  <div id="dom-wrapper"></div>

  <script>
    fetch('dom.html').then(r => r.text()).then(html => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const wrapper = doc.querySelector('.pagesnap-component-wrapper') || doc.body;
      document.getElementById('dom-wrapper').appendChild(wrapper);
      setupCrossLayerHover();
    });

    let dogApp = null;
    (async function initWebGL() {
      const container = document.getElementById('canvas-container');
      const width = window.innerWidth;
      const height = window.innerHeight;

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();

      // Camera: close-up FOV 35 perfectly framed on wolf
      const camera = new THREE.PerspectiveCamera(35, width / height, 0.01, 1000);
      camera.position.set(0.15, 1.35, 16.5); // Moved closer (z=16.5) so wolf head & chest are huge and dominant!
      scene.add(camera);
      camera.lookAt(new THREE.Vector3(0.95, 1.45, 0));

      const textureLoader = new THREE.TextureLoader();
      const loadTex = (url) => {
        const t = textureLoader.load(url);
        t.flipY = false;
        return t;
      };

      const dogNormals = loadTex('assets/dog_normals.jpg');
      const branchesNormals = loadTex('assets/branches_normals.dds');
      const dogDiffuse = loadTex('assets/dog_diffuse.dds');

      // Crop Matcaps:
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = 'assets/matcap-combined-resized.jpg';
      await new Promise(r => { img.onload = r; });

      const cellW = img.width / 10;
      const cellH = img.height / 2;

      function cropMatcap(idx) {
        const cv = document.createElement('canvas');
        cv.width = 256; cv.height = 256;
        const ctx = cv.getContext('2d');
        const col = idx % 10;
        const row = Math.floor(idx / 10);
        ctx.drawImage(img, col * cellW, row * cellH, cellW, cellH, 0, 0, 256, 256);
        return new THREE.CanvasTexture(cv);
      }

      // Slot 19: Midnight navy hero matcap
      const matcapHero = cropMatcap(19);
      // Slot 11: Vibrant iridescent pink/purple (Louise's Phone)
      const matcapLouise = cropMatcap(11);

      // Eye Material: Authentic ice-blue with sharp pupil and catchlight
      const eyeCanvas = document.createElement('canvas');
      eyeCanvas.width = 128; eyeCanvas.height = 128;
      const ectx = eyeCanvas.getContext('2d');
      
      const rad = ectx.createRadialGradient(64, 64, 2, 64, 64, 52);
      rad.addColorStop(0, '#7dd3fc'); // bright sky-blue
      rad.addColorStop(0.35, '#38bdf8'); // ice blue
      rad.addColorStop(0.7, '#0369a1'); // sapphire rim
      rad.addColorStop(1, '#082f49');
      ectx.fillStyle = rad;
      ectx.fillRect(0, 0, 128, 128);

      ectx.fillStyle = '#020617';
      ectx.beginPath();
      ectx.ellipse(64, 64, 10, 32, 0, 0, Math.PI * 2);
      ectx.fill();

      ectx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ectx.beginPath();
      ectx.arc(54, 52, 6, 0, Math.PI * 2);
      ectx.fill();

      const eyeTex = new THREE.CanvasTexture(eyeCanvas);
      const eyeMaterial = new THREE.MeshBasicMaterial({
        map: eyeTex,
        transparent: true
      });

      // Wolf Body Material: Slot 19 matcap + subtle navy tint
      const wolfMaterial = new THREE.MeshMatcapMaterial({
        matcap: matcapHero,
        normalMap: dogNormals,
        normalScale: new THREE.Vector2(0.65, 0.65),
        color: new THREE.Color(0x354460),
        skinning: true
      });

      const leafMaterial = new THREE.MeshMatcapMaterial({
        matcap: matcapHero,
        normalMap: branchesNormals,
        normalScale: new THREE.Vector2(0.4, 0.4),
        color: new THREE.Color(0x28344c),
        skinning: true
      });

      const dracoLoader = new THREE.DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      const gltfLoader = new THREE.GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);

      let mixer = null;
      const dogContainer = new THREE.Object3D();
      scene.add(dogContainer);

      let dogModel = null;

      gltfLoader.load('assets/dog.drc.glb', (gltf) => {
        dogModel = gltf.scene;
        dogModel.scale.set(20, 20, 20);
        dogModel.position.set(0.2 * 20, -0.5 * 20, 0.15 * 20);

        dogModel.traverse((child) => {
          if (child.isMesh) {
            const name = child.name;
            if (name.includes('Leye') || name.includes('Reye')) {
              child.material = eyeMaterial;
            } else if (name.includes('BRANCHS') || name.includes('leaf') || name.includes('branch')) {
              child.material = leafMaterial;
            } else {
              child.material = wolfMaterial;
            }
          }
        });

        dogContainer.add(dogModel);

        // Hero baseline pose: calibrated to match Image #1 framing
        dogContainer.rotation.y = 0.62;
        dogContainer.rotation.x = -0.15;
        dogContainer.position.set(0.0, -0.2, 0);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(dogModel);
          const action = mixer.clipAction(gltf.animations[0]);
          action.play();
        }

        window.__VISUAL_MATCH_READY__ = true;
      });

      const DEPTH_CURVE = [16.5, 24, 30, 36, 28, 22]; // closer zoom curve
      const V_ROT_CURVE = [35, 20, 30, 30, -50, -145];

      function getSplineValue(arr, t) {
        const p = t * (arr.length - 1);
        const idx = Math.min(Math.floor(p), arr.length - 2);
        const frac = p - idx;
        const s = frac * frac * (3 - 2 * frac);
        return arr[idx] * (1 - s) + arr[idx + 1] * s;
      }

      let mouseX = 0, mouseY = 0;
      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
      });

      const clock = new THREE.Clock();
      function render() {
        requestAnimationFrame(render);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        const scrollT = Math.min(1, Math.max(0, window.scrollY / maxScroll));

        const curDepth = getSplineValue(DEPTH_CURVE, scrollT);
        const curRotY = getSplineValue(V_ROT_CURVE, scrollT);

        camera.position.z = curDepth;
        if (dogContainer) {
          dogContainer.rotation.y = THREE.MathUtils.degToRad(curRotY) + mouseX * 0.08;
          dogContainer.rotation.x = -0.15 + mouseY * 0.05;
        }

        renderer.render(scene, camera);
      }
      render();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      dogApp = {
        setMatcap(targetMatcap, tintHex) {
          gsap.to(wolfMaterial.color, {
            r: new THREE.Color(tintHex).r,
            g: new THREE.Color(tintHex).g,
            b: new THREE.Color(tintHex).b,
            duration: 0.5,
            ease: "power2.out"
          });
          wolfMaterial.matcap = targetMatcap;
          leafMaterial.matcap = targetMatcap;
          wolfMaterial.needsUpdate = true;
          leafMaterial.needsUpdate = true;
        },
        matcapHero,
        matcapLouise
      };
    })();

    function setupCrossLayerHover() {
      const artLayer = document.getElementById('case-art-layer');
      const links = document.querySelectorAll('.home-cases-list a, [data-matcap]');

      links.forEach((link) => {
        const text = link.innerText.toLowerCase();
        link.addEventListener('mouseenter', () => {
          if (!dogApp) return;

          document.body.classList.add('is-case-hovered');
          link.classList.add('is-hovered');

          if (text.includes('louise')) {
            artLayer.style.backgroundImage = "url('https://dogstudio.co/app/themes/portfolio-2018/static/assets/images/cases/this-was-louises-phone/background-1440.png')";
            artLayer.classList.add('is-visible');
            dogApp.setMatcap(dogApp.matcapLouise, 0xd946ef);
          } else {
            artLayer.style.backgroundImage = "url('https://dogstudio.co/app/themes/portfolio-2018/static/assets/images/cases/tomorrowland/background-1440.png')";
            artLayer.classList.add('is-visible');
            dogApp.setMatcap(dogApp.matcapLouise, 0x38bdf8);
          }
        });

        link.addEventListener('mouseleave', () => {
          if (!dogApp) return;
          document.body.classList.remove('is-case-hovered');
          link.classList.remove('is-hovered');
          artLayer.classList.remove('is-visible');
          dogApp.setMatcap(dogApp.matcapHero, 0x354460);
        });
      });
    }
  </script>
</body>
</html>
