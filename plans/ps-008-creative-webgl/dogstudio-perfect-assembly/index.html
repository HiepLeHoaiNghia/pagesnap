<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dogstudio Master Assembly - 1-to-1 Ground Truth</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      margin: 0;
      background-color: #090a0f !important;
      color: #fff;
      overflow-x: hidden;
    }
    #bg-layer {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #090a0f url('./assets/background-xl.png') no-repeat center top;
      background-size: cover;
      opacity: 0.9;
      z-index: -2;
      pointer-events: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .pagesnap-component-wrapper {
      position: relative;
      z-index: 1;
      background: transparent !important;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div id="bg-layer"></div>
  <div id="canvas-container"></div>
  <div id="dom-wrapper"></div>

  <script>
    fetch('dom.html').then(r => r.text()).then(html => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      const wrapper = doc.querySelector('.pagesnap-component-wrapper') || doc.body;
      document.getElementById('dom-wrapper').appendChild(wrapper);
      setupCrossLayerHover();
    });

    let dogApp = null;
    (async function initWebGL() {
      const container = document.getElementById('canvas-container');
      const width = window.innerWidth;
      const height = window.innerHeight;

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();

      // Camera: exact FOV 35 framed on wolf head
      const camera = new THREE.PerspectiveCamera(35, width / height, 0.01, 1000);
      camera.position.set(0.2, 1.6, 22.0);
      scene.add(camera);
      camera.lookAt(new THREE.Vector3(1.1, 1.8, 0));

      const textureLoader = new THREE.TextureLoader();
      const loadTex = (url) => {
        const t = textureLoader.load(url);
        t.flipY = false;
        return t;
      };

      const dogNormals = loadTex('assets/dog_normals.jpg');
      const branchesNormals = loadTex('assets/branches_normals.dds');

      // Crop Matcaps:
      // Matcap 0: Default Hero Midnight Blue/Indigo
      // Matcap 11: Vibrant Neon Pink/Purple (Louise's Phone)
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = 'assets/matcap-combined-resized.jpg';
      await new Promise(r => { img.onload = r; });

      const cellW = img.width / 10;
      const cellH = img.height / 2;

      function cropMatcap(idx) {
        const cv = document.createElement('canvas');
        cv.width = 256; cv.height = 256;
        const ctx = cv.getContext('2d');
        const col = idx % 10;
        const row = Math.floor(idx / 10);
        ctx.drawImage(img, col * cellW, row * cellH, cellW, cellH, 0, 0, 256, 256);
        return new THREE.CanvasTexture(cv);
      }

      const matcapHero = cropMatcap(1); // Matcap 1 for hero cyan/indigo
      const matcapLouise = cropMatcap(11); // Matcap 11 for Louise pink/purple
      const matcapGoldenEye = cropMatcap(0);

      // Dedicated Eye Glowing Material
      const eyeCanvas = document.createElement('canvas');
      eyeCanvas.width = 128; eyeCanvas.height = 128;
      const ectx = eyeCanvas.getContext('2d');
      // Amber glowing pupil with dark slit center
      const rad = ectx.createRadialGradient(64, 64, 4, 64, 64, 56);
      rad.addColorStop(0, '#ffcc00'); // glowing amber
      rad.addColorStop(0.35, '#ff8800');
      rad.addColorStop(0.7, '#662200');
      rad.addColorStop(1, '#000000');
      ectx.fillStyle = rad;
      ectx.fillRect(0, 0, 128, 128);
      // Center pupil
      ectx.fillStyle = '#090a0f';
      ectx.beginPath();
      ectx.ellipse(64, 64, 8, 28, 0, 0, Math.PI * 2);
      ectx.fill();
      const eyeTex = new THREE.CanvasTexture(eyeCanvas);

      const eyeMaterial = new THREE.MeshBasicMaterial({
        map: eyeTex,
        transparent: true
      });

      // Wolf Body Material with midnight navy tint (0x28344c)
      let currentMatcapTex = matcapHero;
      const wolfMaterial = new THREE.MeshMatcapMaterial({
        matcap: matcapHero,
        normalMap: dogNormals,
        normalScale: new THREE.Vector2(0.55, 0.55),
        color: new THREE.Color(0x28344c),
        skinning: true
      });

      const leafMaterial = new THREE.MeshMatcapMaterial({
        matcap: matcapHero,
        normalMap: branchesNormals,
        normalScale: new THREE.Vector2(0.4, 0.4),
        color: new THREE.Color(0x28344c),
        skinning: true
      });

      const dracoLoader = new THREE.DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
      const gltfLoader = new THREE.GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);

      let mixer = null;
      const dogContainer = new THREE.Object3D();
      scene.add(dogContainer);

      let dogModel = null;

      gltfLoader.load('assets/dog.drc.glb', (gltf) => {
        dogModel = gltf.scene;
        dogModel.scale.set(20, 20, 20);
        dogModel.position.set(0.2 * 20, -0.5 * 20, 0.15 * 20);

        dogModel.traverse((child) => {
          if (child.isMesh) {
            const name = child.name.toLowerCase();
            if (name.includes('eye')) {
              child.material = eyeMaterial;
            } else if (name.includes('branch') || name.includes('leaf')) {
              child.material = leafMaterial;
            } else {
              child.material = wolfMaterial;
            }
          }
        });

        dogContainer.add(dogModel);

        // Hero baseline pose
        dogContainer.rotation.y = 0.62;
        dogContainer.rotation.x = -0.15;
        dogContainer.position.set(0.0, -0.2, 0);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(dogModel);
          const action = mixer.clipAction(gltf.animations[0]);
          action.play();
        }

        window.__MASTER_DOG_READY__ = true;
      });

      // Choreography truth interpolation
      // DEPTH: [1, 18, 30, 35, 25, 20]
      // V_ROTATION: [60, 36.7, 53, 53, -80, -150]
      const DEPTH_CURVE = [22, 28, 34, 38, 30, 25];
      const V_ROT_CURVE = [35, 20, 30, 30, -50, -145]; // in degrees

      function getSplineValue(arr, t) {
        const p = t * (arr.length - 1);
        const idx = Math.min(Math.floor(p), arr.length - 2);
        const frac = p - idx;
        const s = frac * frac * (3 - 2 * frac);
        return arr[idx] * (1 - s) + arr[idx + 1] * s;
      }

      // Mouse tracking
      let mouseX = 0, mouseY = 0;
      window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
        mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
      });

      const clock = new THREE.Clock();
      function render() {
        requestAnimationFrame(render);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        const scrollT = Math.min(1, Math.max(0, window.scrollY / maxScroll));

        const curDepth = getSplineValue(DEPTH_CURVE, scrollT);
        const curRotY = getSplineValue(V_ROT_CURVE, scrollT);

        camera.position.z = curDepth;
        if (dogContainer) {
          dogContainer.rotation.y = THREE.MathUtils.degToRad(curRotY) + mouseX * 0.08;
          dogContainer.rotation.x = -0.15 + mouseY * 0.05;
        }

        renderer.render(scene, camera);
      }
      render();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      dogApp = {
        setMatcap(targetMatcap, tintHex) {
          gsap.to(wolfMaterial.color, {
            r: new THREE.Color(tintHex).r,
            g: new THREE.Color(tintHex).g,
            b: new THREE.Color(tintHex).b,
            duration: 0.6,
            ease: "power2.out"
          });
          wolfMaterial.matcap = targetMatcap;
          leafMaterial.matcap = targetMatcap;
          wolfMaterial.needsUpdate = true;
          leafMaterial.needsUpdate = true;
        },
        matcapHero,
        matcapLouise
      };
    })();

    function setupCrossLayerHover() {
      const links = document.querySelectorAll('.home-cases-list a, [data-matcap]');
      links.forEach((link) => {
        const text = link.innerText.toLowerCase();
        link.addEventListener('mouseenter', () => {
          if (!dogApp) return;
          if (text.includes('louise')) {
            dogApp.setMatcap(dogApp.matcapLouise, 0xd946ef); // Neon pink/purple!
          } else {
            dogApp.setMatcap(dogApp.matcapLouise, 0x38bdf8); // Cyan blue
          }
        });

        link.addEventListener('mouseleave', () => {
          if (!dogApp) return;
          dogApp.setMatcap(dogApp.matcapHero, 0x28344c); // Restore midnight navy
        });
      });
    }
  </script>
</body>
</html>
