<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      background: #0b0d13;
      overflow: hidden;
      width: 1500px;
      height: 900px;
    }
    #canvas-container {
      width: 1500px;
      height: 900px;
      position: absolute;
      top: 0;
      left: 0;
    }
    .atmospheric-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 1500px;
      height: 900px;
      z-index: 0;
      background-color: #0b0d13;
      background-image:
        radial-gradient(ellipse 70% 60% at 20% 36%, rgba(85, 36, 135, 0.75) 0%, rgba(48, 20, 90, 0.45) 45%, transparent 75%),
        radial-gradient(ellipse 65% 55% at 54% 18%, rgba(26, 110, 135, 0.65) 0%, rgba(16, 55, 75, 0.3) 50%, transparent 75%),
        radial-gradient(circle at 16% 45%, rgba(160, 30, 110, 0.45) 0%, transparent 42%),
        radial-gradient(circle at 45% 65%, rgba(30, 50, 90, 0.25) 0%, transparent 55%),
        radial-gradient(ellipse 85% 85% at 50% 50%, transparent 45%, rgba(9, 10, 15, 0.9) 100%);
      pointer-events: none;
    }
    .noise-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 1500px;
      height: 900px;
      z-index: 0;
      background-image: url('./assets/noise.png');
      background-repeat: repeat;
      opacity: 0.04;
      mix-blend-mode: overlay;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div class="atmospheric-background"></div>
  <div class="noise-overlay"></div>
  <div id="canvas-container"></div>

  <script>
    (async function () {
      const container = document.getElementById('canvas-container');
      const width = 1500;
      const height = 900;

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(1);
      renderer.setSize(width, height);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.LinearToneMapping;
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();

      // Camera: calibrated perspective camera matching preview.png
      const camera = new THREE.PerspectiveCamera(35, width / height, 0.01, 1000);
      const baseCamZ = 22.0;
      camera.position.set(0.2, 1.6, baseCamZ);
      scene.add(camera);

      const target = new THREE.Vector3(1.1, 1.8, 0);
      camera.lookAt(target);

      const textureLoader = new THREE.TextureLoader();
      const loadTex = (url) => {
        const t = textureLoader.load(url);
        t.flipY = false;
        return t;
      };

      const dogNormals = loadTex('./assets/dog_normals.jpg');

      // Crop Matcap Index 1 (Cyan/Purple iridescent matcap)
      const matcapCanvas = document.createElement('canvas');
      matcapCanvas.width = 256;
      matcapCanvas.height = 256;
      const mctx = matcapCanvas.getContext('2d');
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = './assets/matcap-combined-resized.jpg';
      await new Promise(r => { img.onload = r; });
      const cellW = img.width / 10;
      const cellH = img.height / 2;
      mctx.drawImage(img, cellW * 1, 0, cellW, cellH, 0, 0, 256, 256);
      const singleMatcapTex = new THREE.CanvasTexture(matcapCanvas);

      // Create realistic glowing amber pupil eye texture
      const eyeCanvas = document.createElement('canvas');
      eyeCanvas.width = 512;
      eyeCanvas.height = 512;
      const ectx = eyeCanvas.getContext('2d');

      // Deep dark navy / black sclera
      ectx.fillStyle = '#060a12';
      ectx.fillRect(0, 0, 512, 512);

      // Warm glowing amber/gold iris
      const irisGrad = ectx.createRadialGradient(256, 256, 40, 256, 256, 220);
      irisGrad.addColorStop(0, '#ffe066');   // Bright inner amber/gold
      irisGrad.addColorStop(0.3, '#f59e0b'); // Vivid golden orange
      irisGrad.addColorStop(0.6, '#b45309'); // Deep amber
      irisGrad.addColorStop(0.85, '#451a03');// Dark amber border
      irisGrad.addColorStop(1.0, '#060a12'); // Blends into socket
      ectx.fillStyle = irisGrad;
      ectx.beginPath();
      ectx.arc(256, 256, 220, 0, Math.PI * 2);
      ectx.fill();

      // Piercing pupil in center
      const pupilGrad = ectx.createRadialGradient(256, 256, 0, 256, 256, 85);
      pupilGrad.addColorStop(0, '#020305');
      pupilGrad.addColorStop(0.85, '#050a12');
      pupilGrad.addColorStop(1.0, '#2d1502');
      ectx.fillStyle = pupilGrad;
      ectx.beginPath();
      ectx.arc(256, 256, 85, 0, Math.PI * 2);
      ectx.fill();

      // Sharp pinpoint specular highlight
      ectx.fillStyle = '#ffffff';
      ectx.beginPath();
      ectx.arc(210, 210, 22, 0, Math.PI * 2);
      ectx.fill();

      ectx.fillStyle = 'rgba(255, 230, 180, 0.7)';
      ectx.beginPath();
      ectx.arc(295, 295, 12, 0, Math.PI * 2);
      ectx.fill();

      const eyeTex = new THREE.CanvasTexture(eyeCanvas);

      const dracoLoader = new THREE.DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

      const gltfLoader = new THREE.GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);

      let mixer = null;
      const dogContainer = new THREE.Object3D();
      scene.add(dogContainer);

      const baseRotY = 0.58;
      const baseRotX = -0.14;
      const basePosX = 0.12;
      const basePosY = 0.06;

      gltfLoader.load('./assets/dog.drc.glb', (gltf) => {
        const model = gltf.scene;

        const scale = 14.5;
        model.scale.set(scale, scale, scale);
        model.position.set(0.2 * scale, -0.5 * scale, 0.15 * scale);

        model.traverse((child) => {
          if (child.isMesh) {
            const name = child.name.toLowerCase();
            if (name.includes('eye')) {
              const uvs = child.geometry.attributes.uv;
              const minU = 0.85396, maxU = 0.98188;
              const minV = 0.64321, maxV = 0.77113;
              for (let i = 0; i < uvs.count; i++) {
                let u = (uvs.getX(i) - minU) / (maxU - minU);
                let v = (uvs.getY(i) - minV) / (maxV - minV);
                uvs.setXY(i, u, v);
              }
              uvs.needsUpdate = true;

              child.material = new THREE.MeshBasicMaterial({
                map: eyeTex
              });
            } else {
              const isLeaf = name.includes('branch') || name.includes('leaf');
              child.material = new THREE.MeshMatcapMaterial({
                matcap: singleMatcapTex,
                normalMap: dogNormals,
                normalScale: new THREE.Vector2(0.68, 0.68),
                color: new THREE.Color(0x566d8e),
                skinning: !!child.isSkinnedMesh,
                side: isLeaf ? THREE.DoubleSide : THREE.FrontSide
              });
            }
          }
        });

        dogContainer.add(model);
        dogContainer.rotation.y = baseRotY;
        dogContainer.rotation.x = baseRotX;
        dogContainer.position.set(basePosX, basePosY, 0);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          const action = mixer.clipAction(gltf.animations[0]);
          action.play();
        }

        window.dogContainer = dogContainer;
        window.camera = camera;
        window.scene = scene;
        window.renderer = renderer;
        window.__DOG_READY__ = true;
        renderer.render(scene, camera);
      });

      // Poses from dog-choreography-truth.json
      // Let's implement full smooth choreography
      const poses = [
        { scroll: 0,    depth: 1,  hRot: 0,    vRot: 60,   xOff: 2,    yOff: -5 },
        { scroll: 500,  depth: 18, hRot: -7.8, vRot: 36.7, xOff: -1.5, yOff: -1.2 },
        { scroll: 1400, depth: 32, hRot: -2.2, vRot: 53,   xOff: -0.4, yOff: 0.5 },
        { scroll: 1800, depth: 35, hRot: 14,   vRot: 53,   xOff: -0.4, yOff: 0 },
        { scroll: 2400, depth: 20, hRot: 12,   vRot: -150, xOff: -1,   yOff: 0 }
      ];

      function interpolate(scrollY) {
        const y = Math.max(0, Math.min(2400, scrollY));
        let i = 0;
        while (i < poses.length - 1 && poses[i + 1].scroll < y) {
          i++;
        }
        if (i >= poses.length - 1) return poses[poses.length - 1];

        const p0 = poses[i];
        const p1 = poses[i + 1];
        const t = (y - p0.scroll) / (p1.scroll - p0.scroll);
        const smoothT = t * t * (3 - 2 * t);

        return {
          depth: p0.depth + (p1.depth - p0.depth) * smoothT,
          hRot: p0.hRot + (p1.hRot - p0.hRot) * smoothT,
          vRot: p0.vRot + (p1.vRot - p0.vRot) * smoothT,
          xOff: p0.xOff + (p1.xOff - p0.xOff) * smoothT,
          yOff: p0.yOff + (p1.yOff - p0.yOff) * smoothT
        };
      }

      window.setScroll = function (scrollY) {
        const p = interpolate(scrollY);

        // Depth: camera distance
        const depthDelta = (p.depth - 1) * 0.35;
        camera.position.z = baseCamZ + depthDelta;

        // V_ROTATION is rotation around Y (Yaw)!
        // At scroll 0 (vRot 60): delta = 0
        // At scroll 2400 (vRot -150): delta = (-150 - 60) * deg = -210 deg
        const vRotDelta = (p.vRot - 60) * (Math.PI / 180);

        // H_ROTATION is pitch (X tilt)
        const hRotDelta = (p.hRot - 0) * (Math.PI / 180) * 0.5;

        // Offsets
        const xOffDelta = (p.xOff - 2) * 0.08;
        const yOffDelta = (p.yOff - (-5)) * 0.05;

        dogContainer.rotation.y = baseRotY + vRotDelta;
        dogContainer.rotation.x = baseRotX + hRotDelta;
        dogContainer.position.x = basePosX + xOffDelta;
        dogContainer.position.y = basePosY + yOffDelta;

        renderer.render(scene, camera);
      };
    })();
  </script>
</body>
</html>
