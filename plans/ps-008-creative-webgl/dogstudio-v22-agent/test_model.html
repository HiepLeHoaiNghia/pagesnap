<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Draco Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
  const loader = new THREE.GLTFLoader();
  const dracoLoader = new THREE.DRACOLoader();
  dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
  loader.setDRACOLoader(dracoLoader);

  loader.load('./assets/dog.drc.glb', (gltf) => {
    console.log('GLTF loaded successfully!');
    const scene = gltf.scene;
    console.log('Scene children count:', scene.children.length);
    const meshes = [];
    scene.traverse((child) => {
      if (child.isMesh || child.isSkinnedMesh) {
        meshes.push({
          name: child.name,
          isSkinned: child.isSkinnedMesh,
          parent: child.parent ? child.parent.name : null,
          material: child.material ? child.material.name : null
        });
      }
    });
    console.log('Found meshes:', JSON.stringify(meshes));
    
    // Check bounding box
    const box = new THREE.Box3().setFromObject(scene);
    console.log('BBox min:', box.min.x, box.min.y, box.min.z);
    console.log('BBox max:', box.max.x, box.max.y, box.max.z);
    console.log('BBox size:', box.getSize(new THREE.Vector3()));
    console.log('BBox center:', box.getCenter(new THREE.Vector3()));
    
    window.TEST_DONE = true;
  }, undefined, (err) => {
    console.error('GLTF load error:', err);
    window.TEST_ERROR = err.message || String(err);
  });
</script>
</body>
</html>
