<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Animation Pose Test</title>
  <style>
    body { margin: 0; background: #090a0f; overflow: hidden; }
    canvas { width: 1500px; height: 900px; display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setSize(1500, 900);
  renderer.setPixelRatio(1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1500 / 900, 0.1, 1000);
  camera.position.set(0.2, 1.6, 22.0);
  camera.lookAt(1.1, 1.8, 0);
  window.renderer = renderer;
  window.scene = scene;
  window.camera = camera;

  const ambient = new THREE.AmbientLight(0xffffff, 1.0);
  scene.add(ambient);

  const loader = new THREE.GLTFLoader();
  const dracoLoader = new THREE.DRACOLoader();
  dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
  loader.setDRACOLoader(dracoLoader);

  loader.load('./assets/dog.drc.glb', (gltf) => {
    const model = gltf.scene;
    scene.add(model);
    window.model = model;

    // Apply materials
    model.traverse((child) => {
      if (child.isMesh || child.isSkinnedMesh) {
        child.material = new THREE.MeshNormalMaterial({ skinning: !!child.isSkinnedMesh });
      }
    });

    if (gltf.animations && gltf.animations.length > 0) {
      window.mixer = new THREE.AnimationMixer(model);
      const action = window.mixer.clipAction(gltf.animations[0]);
      action.play();
      window.mixer.setTime(0.5); // sample at 0.5s
    }

    renderer.render(scene, camera);
    window.FRAMING_READY = true;
  });
</script>
</body>
</html>
