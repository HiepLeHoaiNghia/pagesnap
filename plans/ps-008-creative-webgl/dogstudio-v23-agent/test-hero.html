<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #090a0f; overflow: hidden; }
    canvas { width: 100vw; height: 100vh; display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1500 / 1190, 0.1, 1000);
    camera.position.set(0.2, 1.6, 22.0);
    camera.lookAt(1.1, 1.8, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(1500, 1190);
    document.body.appendChild(renderer.domElement);

    const loader = new THREE.GLTFLoader();
    const draco = new THREE.DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.3/');
    loader.setDRACOLoader(draco);

    loader.load('/assets/dog.drc.glb', (gltf) => {
      window.wolf = gltf.scene;
      scene.add(gltf.scene);
      renderer.render(scene, camera);
      window.rendered = true;
    });
  </script>
</body>
</html>
