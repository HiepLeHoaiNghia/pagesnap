<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <script>
    async function test() {
      const renderer = new THREE.WebGLRenderer();
      const gl = renderer.getContext();
      const ext = gl.getExtension('WEBGL_compressed_texture_astc');
      if (!ext) {
        window.res = { error: 'no ext' };
        return;
      }
      const resp = await fetch('/assets/branches_normals.dds');
      const buf = await resp.arrayBuffer();
      const u8 = new Uint8Array(buf);
      const width = u8[7] | (u8[8] << 8) | (u8[9] << 16);
      const height = u8[10] | (u8[11] << 8) | (u8[12] << 16);
      
      const compTex = new THREE.CompressedTexture(
        [{ data: u8.subarray(16), width, height }],
        width,
        height,
        ext.COMPRESSED_RGBA_ASTC_8x8_KHR
      );
      compTex.needsUpdate = true;
      compTex.minFilter = THREE.LinearFilter;
      compTex.magFilter = THREE.LinearFilter;
      
      const mat = new THREE.MeshMatcapMaterial({ normalMap: compTex });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
      const scene = new THREE.Scene();
      scene.add(mesh);
      const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 10);
      cam.position.z = 2;
      renderer.render(scene, cam);
      window.res = { ok: true, width, height };
    }
    test();
  </script>
</body>
</html>
