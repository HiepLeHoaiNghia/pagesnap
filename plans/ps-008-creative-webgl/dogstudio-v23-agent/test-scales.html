<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: #090a0f; overflow: hidden; }
    canvas { width: 100vw; height: 100vh; display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, 1500 / 1190, 0.1, 1000);
    camera.position.set(0.2, 1.6, 22.0);
    camera.lookAt(1.1, 1.8, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(1500, 1190);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
    dirLight.position.set(5, 10, 10);
    scene.add(dirLight);

    const loader = new THREE.GLTFLoader();
    const draco = new THREE.DRACOLoader();
    draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.3/');
    loader.setDRACOLoader(draco);

    let wolfGroup = new THREE.Group();
    scene.add(wolfGroup);

    loader.load('/assets/dog.drc.glb', (gltf) => {
      wolfGroup.add(gltf.scene);
      wolfGroup.rotation.y = 35 * Math.PI / 180;
      
      window.setScale = (s) => {
        wolfGroup.scale.set(s, s, s);
        renderer.render(scene, camera);
      };
      window.setScale(12);
      window.ready = true;
    });
  </script>
</body>
</html>
