<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dogstudio 3D Core - Step 1 Ground Truth (Exact Pose & Lighting Matched)</title>
  <style>
    body {
      margin: 0;
      background: #090b10;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #canvas-container {
      width: 1500px;
      height: 1190px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    (async function () {
      const container = document.getElementById('canvas-container');
      const width = 1500;
      const height = 1190;

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(1);
      renderer.setSize(width, height);
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();

      // Camera: exact match framing
      const camera = new THREE.PerspectiveCamera(35, width / height, 0.01, 1000);
      camera.position.set(0.2, 1.6, 22.0);
      scene.add(camera);

      // Target head center
      const target = new THREE.Vector3(1.1, 1.8, 0);
      camera.lookAt(target);

      const textureLoader = new THREE.TextureLoader();
      const loadTex = (url) => {
        const t = textureLoader.load(url);
        t.flipY = false;
        return t;
      };

      const dogNormals = loadTex('assets/dog_normals.jpg');
      const branchesNormals = loadTex('assets/branches_normals.dds');

      // Crop Matcap Index 1 (Cyan/Purple iridescent matcap matching hero)
      const matcapCanvas = document.createElement('canvas');
      matcapCanvas.width = 256;
      matcapCanvas.height = 256;
      const mctx = matcapCanvas.getContext('2d');
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = 'assets/matcap-combined-resized.jpg';
      await new Promise(r => { img.onload = r; });
      const cellW = img.width / 10;
      const cellH = img.height / 2;
      // Index 1: row 0, col 1
      mctx.drawImage(img, cellW * 1, 0, cellW, cellH, 0, 0, 256, 256);
      const singleMatcapTex = new THREE.CanvasTexture(matcapCanvas);

      const dracoLoader = new THREE.DRACOLoader();
      dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

      const gltfLoader = new THREE.GLTFLoader();
      gltfLoader.setDRACOLoader(dracoLoader);

      let mixer = null;
      let dogContainer = new THREE.Object3D();
      scene.add(dogContainer);

      gltfLoader.load('assets/dog.drc.glb', (gltf) => {
        const model = gltf.scene;

        // Model internal offset: { scale: 20, offsetX: .2, offsetY: -.5, offsetZ: .15 }
        model.scale.set(20, 20, 20);
        model.position.set(0.2 * 20, -0.5 * 20, 0.15 * 20);

        model.traverse((child) => {
          if (child.isMesh) {
            const isLeaf = child.name.toLowerCase().includes('branch') || child.name.toLowerCase().includes('leaf');
            child.material = new THREE.MeshMatcapMaterial({
              matcap: singleMatcapTex,
              normalMap: isLeaf ? branchesNormals : dogNormals,
              normalScale: new THREE.Vector2(0.55, 0.55),
              color: new THREE.Color(0x3a4866), // Tint dark navy blue to match Dogstudio mood lighting!
              skinning: !!child.isSkinnedMesh
            });
          }
        });

        dogContainer.add(model);

        // Turn dog body so head looks towards viewer (slight left angle)
        dogContainer.rotation.y = 0.62; // ~35 degrees
        dogContainer.rotation.x = -0.15; // tilt head up towards viewer
        dogContainer.position.set(0.0, -0.2, 0);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          const action = mixer.clipAction(gltf.animations[0]);
          action.play();
        }

        window.__DOG_READY__ = true;
      });

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
</body>
</html>
