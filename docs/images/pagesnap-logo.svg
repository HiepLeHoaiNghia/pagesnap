<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18112e" />
      <stop offset="50%" stop-color="#110d24" />
      <stop offset="100%" stop-color="#0a0817" />
    </linearGradient>

    <!-- Outer Glow / Accent Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Bracket Neon Gradient -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>

    <!-- Subtle Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bgGrad)" filter="url(#cardShadow)" />
  <rect x="28" y="28" width="456" height="456" rx="112" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-opacity="0.35" />

  <!-- Inner Ambient Spotlight -->
  <circle cx="256" cy="256" r="170" fill="#8b5cf6" opacity="0.12" filter="blur(30px)" />

  <!-- Component Viewfinder Brackets -->
  <!-- Top-Left Bracket -->
  <path d="M 108 206 L 108 140 A 32 32 0 0 1 140 108 L 206 108" 
        fill="none" 
        stroke="url(#bracketGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />

  <!-- Bottom-Right Bracket -->
  <path d="M 404 306 L 404 372 A 32 32 0 0 1 372 404 L 306 404" 
        fill="none" 
        stroke="url(#bracketGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonGlow)" />

  <!-- Center Instant Snap Lightning Bolt -->
  <polygon points="274,124 176,270 248,270 228,396 348,244 274,244" 
           fill="url(#boltGrad)" 
           filter="url(#neonGlow)" />
</svg>
