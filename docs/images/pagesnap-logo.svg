<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Individual Blade Gradients for Mechanical Depth -->
    <linearGradient id="blade0" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="blade1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="blade2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="blade3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="blade4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="blade5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <!-- Core Aperture Glow -->
    <radialGradient id="apertureGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </radialGradient>

    <!-- High-Precision Shadow for White & Dark Contrast -->
    <filter id="precisionShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- PURE TRANSPARENT BACKGROUND (NO BOX) -->

  <g filter="url(#precisionShadow)" transform="translate(256, 256)">
    <!-- 6 Symmetrical Precision Shutter Blades -->
    <!-- Blade 0 (Top-Right Cyan) -->
    <path d="M 0 -204 L 126 -132 L 72 -38 L 0 -80 Z" fill="url(#blade0)" />
    
    <!-- Blade 1 (Right Sky Blue) -->
    <path d="M 177 -102 L 177 42 L 80 16 L 92 -70 Z" fill="url(#blade1)" />
    
    <!-- Blade 2 (Bottom-Right Indigo) -->
    <path d="M 177 102 L 51 174 L 8 96 L 88 58 Z" fill="url(#blade2)" />
    
    <!-- Blade 3 (Bottom-Left Violet) -->
    <path d="M 0 204 L -126 132 L -72 38 L 0 80 Z" fill="url(#blade3)" />
    
    <!-- Blade 4 (Left Deep Purple) -->
    <path d="M -177 102 L -177 -42 L -80 -16 L -92 70 Z" fill="url(#blade4)" />
    
    <!-- Blade 5 (Top-Left Neon Magenta) -->
    <path d="M -177 -102 L -51 -174 L -8 -96 L -88 -58 Z" fill="url(#blade5)" />

    <!-- Center Precision Aperture Lens Core -->
    <circle cx="0" cy="0" r="30" fill="url(#apertureGlow)" stroke="#ffffff" stroke-width="2" />
    <circle cx="0" cy="0" r="14" fill="#0f172a" opacity="0.85" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>
</svg>
