<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan to Violet Gradient for Brackets -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Crisp White Bolt with subtle cool tint -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Clean shadow to ensure high contrast on light backgrounds and glow on dark -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- PURE TRANSPARENT BACKGROUND (NO BOX) -->

  <!-- Top-Left Bracket -->
  <path d="M 64 220 L 64 100 A 36 36 0 0 1 100 64 L 220 64" 
        fill="none" 
        stroke="url(#bracketGrad)" 
        stroke-width="48" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glyphShadow)" />

  <!-- Bottom-Right Bracket -->
  <path d="M 448 292 L 448 412 A 36 36 0 0 1 412 448 L 292 448" 
        fill="none" 
        stroke="url(#bracketGrad)" 
        stroke-width="48" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glyphShadow)" />

  <!-- Center Instant Snap Lightning Bolt -->
  <polygon points="284,80 144,272 248,272 216,432 376,240 272,240" 
           fill="url(#boltGrad)" 
           filter="url(#glyphShadow)" />
</svg>
