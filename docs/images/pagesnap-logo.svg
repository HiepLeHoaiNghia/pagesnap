<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Document Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Shutter Corner Gradient -->
    <linearGradient id="cornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Sparkle Accent Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>
    <filter id="docShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#090d16" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Main Squircle App Icon Container -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Border for Depth -->
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.2" />

  <!-- Viewfinder / Snapshot Corner Reticles -->
  <!-- Top-Left -->
  <path d="M 88 152 L 88 108 A 20 20 0 0 1 108 88 L 152 88" fill="none" stroke="url(#cornerGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top-Right -->
  <path d="M 360 88 L 404 88 A 20 20 0 0 1 424 108 L 424 152" fill="none" stroke="url(#cornerGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Left -->
  <path d="M 88 360 L 88 404 A 20 20 0 0 0 108 424 L 152 424" fill="none" stroke="url(#cornerGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Right -->
  <path d="M 360 424 L 404 424 A 20 20 0 0 0 424 404 L 424 360" fill="none" stroke="url(#cornerGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- The Document Page (Centered) -->
  <g filter="url(#docShadow)">
    <!-- Base Page with Folded Top-Right Corner -->
    <path d="M 176 136 
             L 284 136 
             L 348 200 
             L 348 376 
             A 16 16 0 0 1 332 392 
             L 176 392 
             A 16 16 0 0 1 160 376 
             L 160 152 
             A 16 16 0 0 1 176 136 Z" 
          fill="url(#docGrad)" />

    <!-- Folded Corner Flap -->
    <path d="M 284 136 L 284 188 A 12 12 0 0 0 296 200 L 348 200 Z" fill="#cbd5e1" />
    <path d="M 284 136 L 348 200" stroke="#94a3b8" stroke-width="2" />

    <!-- Document Content Lines (Markdown & Code Glyphs) -->
    <!-- Heading Line -->
    <rect x="194" y="174" width="70" height="12" rx="6" fill="#8b5cf6" />
    
    <!-- Body Lines -->
    <rect x="194" y="216" width="120" height="10" rx="5" fill="#64748b" opacity="0.6" />
    <rect x="194" y="244" width="110" height="10" rx="5" fill="#64748b" opacity="0.6" />
    <rect x="194" y="272" width="124" height="10" rx="5" fill="#64748b" opacity="0.6" />
    
    <!-- Code Block / Highlight Row -->
    <rect x="194" y="306" width="118" height="28" rx="6" fill="#e2e8f0" />
    <!-- Markdown [M↓] or code snippet accent -->
    <rect x="204" y="315" width="40" height="10" rx="4" fill="#3b82f6" />
    <rect x="252" y="315" width="50" height="10" rx="4" fill="#10b981" />
  </g>

  <!-- Shutter / Snapshot Sparkle Star (Top-Right Accent) -->
  <path d="M 416 96 
           C 416 116 424 124 444 124 
           C 424 124 416 132 416 152 
           C 416 132 408 124 388 124 
           C 408 124 416 116 416 96 Z" 
        fill="url(#sparkleGrad)" filter="url(#shadow)" />
</svg>
